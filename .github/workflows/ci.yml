name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/student-affairs-mvp
      - codex/feature/comprehensive-upgrade
      - 'codex/**'
      - 'release/**'
      - integration/product-v3

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Shanghai]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Current product and service regressions
        run: npm run test:product
        env:
          TZ: ${{ matrix.timezone }}
      - name: Preserve actual group outcomes even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-${{ strategy.job-index }}
          path: .data/candidate11/checks/current-product/
          if-no-files-found: error

  current-safety:
    # Windows supplies the existing PowerShell lock test. Linux records that
    # host-only test as NOT_AVAILABLE, while still completing independent groups.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve long historical paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Current offline experiment and executor safety
        run: npm run test:safety
        env:
          TZ: Asia/Shanghai
      - name: Preserve preparation failures and independent results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-${{ matrix.os }}
          path: .data/candidate11/checks/current-safety/
          if-no-files-found: error

  historical:
    # Always run old assertions and upload their real FAIL/NOT_AVAILABLE results.
    # Only these audited signatures are non-blocking; new tests/content fail.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Immutable originals and historical replay
        run: node scripts/historical-ci-policy.mjs
        env:
          TZ: Asia/Shanghai
          HISTORICAL_KNOWN_FAILURES: >-
            {"baseline":"533a1aa4b0b6ffffe090c41f7e661179e0638714","groups":{
              "historical-originals":{"reason":"Legacy hashes differ from already audited starting bytes; unchanged originals only, active tool lock upgrade explicitly allowed."},
              "d19-diagnostic":{"reason":"Private D17 artifacts/ledger snapshot are not shipped to CI.","unavailable":true,"tests":[],"errors":["D17"]},
              "vitest-d17-history":{"reason":"Private D17 artifacts/ledger snapshot are not shipped to CI.","unavailable":true,"tests":[],"errors":["D17"]},
              "d9-historical":{"reason":"Frozen D9 guard predates authorized launcher changes.","tests":["frozen 12×2 package is intact and remains unsent"],"errors":["D9_GUARD_FILE_DRIFT_scripts/serve-candidate15-d8.mjs"]},
              "rco-5-007":{"reason":"Frozen replay runtime hash and authorized dev-tool lock upgrade; only exact audited lock bytes allowed.","tests":["RCO-5-007 prediction and scoring dependency graphs are hash bound"],"errorAlternatives":[["FREEZE_HASH_MISMATCH:scripts/run-rco-5-007-replay.ts"],["FREEZE_HASH_MISMATCH:package-lock.json"]],"fileSha256":{"package-lock.json":"e5c63680981d79e1be8e1bf1927fd84295ad106cd65b0780e66bb8ccc2464b33"}},
              "c11-history":{"reason":"Frozen C11 gate still expects historical AGENTS bytes.","tests":["read-only historical verification is deterministic without network or a current billing window"],"errors":["C11_HISTORY_PROTECTED_CHANGED:AGENTS.md"]},
              "c11-gateway":{"reason":"Five original gateway cases stop at the same historical AGENTS guard.","tests":["candidate11 mock transport retains reserve and never auto-retries","candidate11 mock timeout retains reserve and never auto-retries","candidate11 mock raw retains reserve and never auto-retries","candidate11 mock settlement retains reserve and never auto-retries","candidate11 mock full retains reserve and never auto-retries"],"errors":["C11_HISTORY_PROTECTED_CHANGED:AGENTS.md"]},
              "vitest-runtime-history":{"reason":"Private recorded browser originals unavailable on hosted CI.","unavailable":true},
              "vitest-carriers-history":{"reason":"Private originals missing on CI; two old launcher hashes retained when available.","unavailable":true,"tests":["src/experiments/realInput01/acceptance.test.tsx > candidate02 paid records replay without a model request > the candidate02 launcher exposes local carriers but keeps all upstream sending disabled","src/experiments/realInput01/acceptance.test.tsx > real App runtime and public send connection; memory/SSR not browser acceptance > recorded launcher builds real App, serves only bound A02 and rejects unauthorized endpoints without model code"],"errors":["REAL_INPUT_LAUNCHER_RECORDED_FILE_CHANGED"]}
            }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical
          path: .data/candidate11/checks/historical/
          if-no-files-found: error

  build-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        if: success() || failure()
        run: node scripts/candidate11-checks.mjs build
      - name: Scan source and build for secrets
        if: success() || failure()
        run: npm run security:scan
      - name: Audit high-severity dependencies
        if: success() || failure()
        run: npm audit --audit-level=high
      - name: Verify Cloudflare package without deployment
        if: success() || failure()
        run: npm run cloudflare:check
