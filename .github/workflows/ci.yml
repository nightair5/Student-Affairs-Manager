name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/student-affairs-mvp
      - codex/feature/comprehensive-upgrade
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test all adapters in UTC
        run: npm run test
        env:
          TZ: UTC

      - name: Test all adapters in Asia/Shanghai
        run: npm run test
        env:
          TZ: Asia/Shanghai

      - name: Build production assets
        run: npm run build

      - name: Scan source and build for secrets
        run: npm run security:scan

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Verify Cloudflare package
        run: npm run cloudflare:check
