# REVIEW TEMPLATE ONLY. Replace both existing 80 and TLS site definitions only
# after recording and verifying their real contents, certificates and ACME paths.
# Run nginx -t and end-to-end bypass checks before making the service public.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name student-affairs.site;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://student-affairs.site$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name student-affairs.site;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/student-affairs.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/student-affairs.site/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    include /opt/student-affairs/deploy/swas/security-headers.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    if ($host != student-affairs.site) { return 444; }
    if ($http_host = "") { return 444; }
    location /api/ {
        client_max_body_size 14m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    # All HTML, assets and /__pilot endpoints go through the same gate.
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
